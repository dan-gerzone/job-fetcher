name: Debug sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python debug.py
      - run: |
          git config user.name "job-fetcher-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug/ && git commit -m "debug output" && git pull --rebase origin main && git push
