name: Probe job boards
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python probe/probe.py
      - run: |
          git config user.name "job-fetcher-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe/ && git commit -m "probe output" && git pull --rebase origin main && git push
